# Keeps the Homebrew formula (Formula/agent-leeway.rb) and the Scoop manifest (bucket/agent-leeway.json) in this
# repository current. This repository is itself the Homebrew tap and the Scoop bucket:
#   brew tap mango-juice/agent-leeway https://github.com/Mango-Juice/agent-leeway
#   scoop bucket add agent-leeway https://github.com/Mango-Juice/agent-leeway
# Runs when a release is published (the release workflow makes a draft; publishing it makes the download URLs
# public), or by hand for a tag. It downloads that release's checksums.txt and archives, checks every archive
# against checksums.txt, regenerates both files with cmd/genpackages and commits them to the default branch as
# github-actions[bot] with the workflow's own GITHUB_TOKEN (no personal token). A re-run for the same release
# finds nothing to change and makes no commit. Commits pushed with GITHUB_TOKEN do not start other workflows.
name: packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag, e.g. v0.1.0
        required: true
permissions: {}
concurrency:
  group: packages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # read the release assets and push the two regenerated files
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: download and check the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/rel" && cd "$RUNNER_TEMP/rel"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -p '*.tar.gz' -p '*.zip'
          sha256sum -c checksums.txt
      - name: regenerate Formula/ and bucket/
        run: go run ./cmd/genpackages -version "$TAG" -checksums "$RUNNER_TEMP/rel/checksums.txt" -out .
      - name: commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula bucket; then echo "Formula and manifest already match $TAG"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-leeway.rb bucket/agent-leeway.json
          git commit -m "Homebrew formula and Scoop manifest for $TAG"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

# GoReleaser configuration, run by .github/workflows/release.yml on a v* tag.
# The GitHub account (Mango-Juice) appears here, in internal/meta/meta.go and in install/.
version: 2
project_name: agent-leeway
# Tests run in a separate job with no secrets (.github/workflows/release.yml), not as GoReleaser hooks.
# Release from the exported public tree (scripts/export_public.py), where LICENSE, NOTICE.md, the READMEs and
# THIRD_PARTY_LICENSES.txt sit at the root; a test checks every archive file below exists there.
builds:
  - main: ./cmd/agent-leeway
    binary: agent-leeway
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/Mango-Juice/agent-leeway/internal/meta.Version={{ .Version }}"]
archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"   # stable names for releases/latest/download
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # license texts must accompany every binary: our LICENSE, NOTICE.md and the generated third-party texts
    # (internal/licenses keeps THIRD_PARTY_LICENSES.txt equal to what go.mod links; a test checks this list)
    files: [LICENSE*, NOTICE*, README*, THIRD_PARTY_LICENSES.txt]
checksum:
  name_template: checksums.txt
  algorithm: sha256
release:
  github:
    owner: Mango-Juice
    name: agent-leeway
  draft: true
# Homebrew and Scoop: this repository is the tap (Formula/) and the bucket (bucket/). The two files are
# regenerated from the published release's checksums.txt by .github/workflows/packages.yml (cmd/genpackages),
# so GoReleaser publishes nothing there (its formula publisher is deprecated since v2.10 and would need a token
# for another repository).
